<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MeoCards — Flashcards</title>
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="Flashcard học từ vựng: tạo bộ thẻ, lật thẻ, trắc nghiệm, đồng bộ qua Google Drive." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><span class="logo">🃏</span> MeoCards</a>
    <div class="topbar-right">
      <span id="syncStatus" class="sync-status" title="Trạng thái đồng bộ"></span>
      <button id="btnSettings" class="icon-btn" title="Cài đặt">⚙</button>
      <div id="authArea"></div>
    </div>
  </header>

  <main id="app"></main>

  <!-- Dialog dùng chung -->
  <dialog id="dialog">
    <form method="dialog" class="dialog-body" id="dialogForm"></form>
  </dialog>

  <div id="toast" class="toast"></div>

  <!-- Thanh công cụ định dạng (dùng chung, gắn vào editor đang focus) -->
  <template id="tplToolbar">
    <div class="rt-toolbar">
      <button type="button" data-cmd="bold" title="Đậm (Ctrl+B)"><b>B</b></button>
      <button type="button" data-cmd="italic" title="Nghiêng (Ctrl+I)"><i>I</i></button>
      <button type="button" data-cmd="underline" title="Gạch chân (Ctrl+U)"><u>U</u></button>
      <button type="button" data-cmd="strikeThrough" title="Gạch ngang"><s>S</s></button>
      <button type="button" data-cmd="code" title="Code (inline)">&lt;/&gt;</button>
      <button type="button" data-cmd="codeblock" title="Khối code">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zm-4.6 15.4L8 18.8 4.8 15.6 8 12.4l1.4 1.4-1.8 1.8zm6.6-1.6L12.8 19l-1.4-1.4 1.8-1.8-1.8-1.8 1.4-1.4L16 16zM13 9V3.5L18.5 9z"/></svg>
      </button>
      <span class="sep"></span>
      <label class="color-btn" title="Màu chữ">
        <span class="a-letter">A</span>
        <input type="color" data-cmd="foreColor" value="#e11d48" />
      </label>
      <label class="color-btn" title="Tô sáng">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.2 2.8 21.2 8.8 11 19H5v-6zM3 21h18v2H3z"/></svg>
        <input type="color" data-cmd="hiliteColor" value="#fde047" />
      </label>
      <button type="button" data-cmd="cloze" title="Ô trống [...] — bôi đen chữ rồi bấm để ẩn khi học">[...]</button>
      <button type="button" data-cmd="removeFormat" title="Xoá định dạng">⌫</button>
    </div>
  </template>

  <script src="app.js"></script>
  <script src="modes.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW:", e)));
    }
  </script>
</body>
</html>
